<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falconix Digital - Smart Letter Generator</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co/7Nz80xdL/Falconix-Digital-Logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#8b5cf6',
                        brandDark: '#4c1d95',
                        brandAccent: '#06b6d4',
                        darkCard: '#141414',
                        darkBg: '#080808'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        signature: ['Dancing Script', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }
        
        .a4-page {
            width: 210mm;
            height: 296.5mm;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: 0 auto;
            position: relative;
            color: #1f2937;
            flex-shrink: 0;
        }
        
        .page-break-before {
            page-break-before: always;
            break-before: page;
        }

        .preview-container {
            overflow: auto;
            background-color: #f3f4f6;
            padding: 2rem;
            border-radius: 0.75rem;
        }
        .dark .preview-container { background-color: #000000; }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInRight 0.3s forwards;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-200 font-sans transition-colors duration-200 h-screen flex flex-col overflow-hidden">

    <div id="login-wrapper" class="fixed inset-0 z-[200] flex flex-col items-center justify-center p-4 bg-gray-100 dark:bg-darkBg transition-opacity duration-500">
        <div class="bg-white dark:bg-darkCard w-full max-w-md p-8 rounded-3xl shadow-2xl flex flex-col items-center border border-gray-200 dark:border-gray-800">
            <img src="https://i.ibb.co/7Nz80xdL/Falconix-Digital-Logo.png" alt="Falconix Logo" class="w-20 h-20 rounded-full mb-4 shadow-lg shadow-brand/30 object-cover border border-gray-200 dark:border-gray-700">
            <h1 class="text-2xl font-black tracking-tight text-gray-900 dark:text-white" style="font-family: 'Inter', sans-serif;">Falconix <span class="text-brand">Digital</span></h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-8 text-center mt-2">Smart Letter Generator - Restricted Access</p>
            
            <button id="google-login-btn" class="w-full bg-white dark:bg-gray-100 text-gray-800 hover:bg-gray-50 border border-gray-300 dark:border-transparent py-3 px-4 rounded-xl font-medium transition-colors shadow-sm flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Sign in with Google
            </button>
            <div id="login-error" class="mt-4 text-red-500 text-sm font-medium hidden text-center"></div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[300] flex flex-col gap-3 pointer-events-none"></div>

    <div id="app-wrapper" class="hidden h-screen w-full flex-col opacity-0 transition-opacity duration-500">
        <div class="h-1.5 w-full bg-gradient-to-r from-brandAccent via-brand to-brandDark shrink-0 z-50"></div>

        <header class="bg-white dark:bg-darkCard border-b border-gray-200 dark:border-gray-800 py-2 px-6 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/7Nz80xdL/Falconix-Digital-Logo.png" alt="Falconix Digital Logo" class="h-8 w-auto object-contain">
                <div class="flex flex-col justify-center">
                    <h1 class="font-black text-lg leading-none tracking-tight text-gray-900 dark:text-white" style="font-family: 'Inter', sans-serif;">Falconix <span class="text-brand">Digital</span></h1>
                    <p class="text-[9px] text-brandAccent font-bold tracking-widest uppercase mt-1 leading-none">Innovation In Flight</p>
                </div>
                <div class="hidden sm:block border-l border-gray-300 dark:border-gray-700 ml-4 pl-4">
                    <h2 class="text-xs font-medium text-gray-500 uppercase tracking-wider">Smart Letter Generator</h2>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="auth-logout-btn" class="text-xs font-bold bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors flex items-center gap-1.5">
                    <i class="ph ph-sign-out text-base"></i> Logout
                </button>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i class="ph ph-moon text-xl dark:hidden"></i>
                    <i class="ph ph-sun text-xl hidden dark:block text-brandAccent"></i>
                </button>
            </div>
        </header>

        <div id="cloud-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white dark:bg-darkCard w-full max-w-4xl h-[80vh] rounded-2xl shadow-2xl flex flex-col border border-gray-200 dark:border-gray-800 overflow-hidden">
                <div class="p-5 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                    <h2 class="font-bold text-gray-900 dark:text-white flex items-center gap-2 text-lg"><i class="ph ph-cloud-check text-brand text-xl"></i> Cloud Letters Archive</h2>
                    <button onclick="document.getElementById('cloud-modal').classList.add('hidden')" class="p-1.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 transition-colors"><i class="ph ph-x text-lg"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto p-6" id="cloud-letters-container">
                    <div class="flex justify-center items-center h-full text-gray-500"><i class="ph ph-spinner animate-spin text-3xl"></i></div>
                </div>
            </div>
        </div>

        <main class="flex-1 overflow-hidden flex flex-col lg:flex-row">
            
            <section class="w-full lg:w-[450px] bg-white dark:bg-darkCard border-r border-gray-200 dark:border-gray-800 flex flex-col shrink-0 lg:h-full">
                <div class="p-6 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
                    <h2 class="font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="ph ph-faders text-brand text-lg"></i> Editor Controls</h2>
                </div>
                
                <div class="p-6 overflow-y-auto flex-1 space-y-6">
                    
                    <div class="space-y-3 bg-brand/5 p-4 rounded-xl border border-brand/20">
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-bold text-brand uppercase tracking-wider"><i class="ph ph-cloud-arrow-up mr-1"></i> Cloud Manager</label>
                            <button id="btn-view-cloud" class="text-[10px] bg-brand text-white font-semibold px-2.5 py-1.5 rounded-lg hover:bg-brandDark transition-colors shadow-sm">View Archives</button>
                        </div>
                        <button id="btn-save-cloud" class="w-full bg-brandAccent hover:bg-brandAccent/80 text-white font-bold py-2 rounded-lg text-sm transition-colors shadow-md flex justify-center items-center gap-2">
                            <i class="ph ph-cloud-check text-lg"></i> Save Letter to Cloud
                        </button>
                        
                        <div class="flex justify-between items-center mt-3 pt-3 border-t border-brand/20">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider">Local Drafts</label>
                            <button type="button" onclick="saveCurrentDraft()" class="text-[10px] bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-semibold px-2 py-1 rounded transition-colors">Save Local</button>
                        </div>
                        <select id="input-drafts" onchange="loadDraft(this.value)" class="w-full bg-white dark:bg-gray-900 border border-brand/30 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none cursor-pointer text-gray-900 dark:text-white font-medium">
                            <option value="">-- Load a Local Draft --</option>
                        </select>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Company Details</label>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="input-agency-phone" value="+91 86370 28337" placeholder="Mobile No." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                            <input type="text" id="input-agency-web" value="falconixdigital.netlify.app" placeholder="Website" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                        </div>
                        <input type="text" id="input-agency-email" value="digitalfalconix@gmail.com" placeholder="Email" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                        <input type="text" id="input-agency-address" value="Motihari, Bihar, India" placeholder="Company Address" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                        
                        <div class="pt-2">
                            <label class="block text-[10px] text-gray-500 mb-1">Company Logo (Image URL or Upload)</label>
                            <div class="flex gap-2">
                                <input type="url" id="input-logo-url" value="https://i.ibb.co/7Nz80xdL/Falconix-Digital-Logo.png" placeholder="https://example.com/logo.png" class="flex-1 min-w-0 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                                <label class="cursor-pointer bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-700 rounded-lg px-3 flex items-center justify-center transition-colors shadow-sm" title="Upload Logo">
                                    <i class="ph ph-upload-simple text-gray-700 dark:text-gray-300"></i>
                                    <input type="file" id="file-logo" class="hidden" accept="image/*">
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-800">

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Document Settings</label>
                        <select id="input-template" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all cursor-pointer text-gray-900 dark:text-white">
                            <option value="blank">Blank Document</option>
                            <option value="offer">Job Offer Letter</option>
                            <option value="telecaller_offer">Telecaller Offer Letter</option>
                            <option value="telecaller_selection">Telecaller Selection</option>
                            <option value="telecaller_tnc">Telecaller T&C Agreement</option>
                            <option value="collab">Business Collaboration Proposal</option>
                            <option value="nda">Non-Disclosure Agreement</option>
                            <option value="warning">Formal Warning Letter</option>
                            <option value="termination">Termination Letter</option>
                            <option value="apology">Formal Apology</option>
                            <option value="onboarding">Client Onboarding</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="date" id="input-date" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none appearance-none text-gray-900 dark:text-white">
                            <input type="text" id="input-ref" placeholder="Ref No." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                        </div>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-800">

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Recipient Details</label>
                        <input type="text" id="input-to-name" placeholder="Recipient Name" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        <input type="text" id="input-to-company" placeholder="Company Name (Optional)" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        <textarea id="input-to-address" placeholder="Recipient Address" rows="2" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white"></textarea>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-800">

                    <div class="space-y-3">
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between items-end">
                                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Letter Content</label>
                                <span class="text-[10px] text-brandAccent font-medium bg-brandAccent/10 px-2 py-0.5 rounded-full">Smart Variables Active</span>
                            </div>
                            
                            <div class="flex flex-wrap gap-1 bg-gray-200 dark:bg-gray-800 p-1 rounded-lg border border-gray-300 dark:border-gray-700 items-center">
                                <button type="button" onclick="undo()" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Undo"><i class="ph ph-arrow-u-up-left"></i></button>
                                <button type="button" onclick="redo()" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Redo"><i class="ph ph-arrow-u-up-right"></i></button>
                                <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                                <button type="button" onclick="insertFormat('**', '**')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Bold Text"><i class="ph ph-text-b"></i></button>
                                <button type="button" onclick="insertFormat('_', '_')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Italic Text"><i class="ph ph-text-italic"></i></button>
                                <button type="button" onclick="insertFormat('==', '==')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Highlight Point"><i class="ph ph-highlighter"></i></button>
                                <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                                <button type="button" onclick="insertFormat('[center]\n', '\n[/center]')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Align Center"><i class="ph ph-text-align-center"></i></button>
                                <button type="button" onclick="insertFormat('[right]\n', '\n[/right]')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Align Right"><i class="ph ph-text-align-right"></i></button>
                                <button type="button" onclick="insertFormat('- ', '')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Bullet Point"><i class="ph ph-list-bullets"></i></button>
                                <button type="button" onclick="insertFormat('\n| Header 1 | Header 2 |\n|---|---|\n| Data 1 | Data 2 |\n', '')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-300 transition-colors" title="Insert Table"><i class="ph ph-table"></i></button>
                                <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                                <button type="button" onclick="insertFormat('\n\n---\n\n', '')" class="p-1.5 hover:bg-white dark:hover:bg-gray-600 rounded text-brand transition-colors" title="Insert Page Break"><i class="ph ph-file-dashed"></i></button>
                            </div>
                        </div>
                        
                        <input type="text" id="input-subject" placeholder="Subject Line" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm font-medium focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        <textarea id="input-body" placeholder="Write content here... Tags like [Recipient Name] will auto-replace!" rows="12" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-3 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white leading-relaxed resize-none"></textarea>
                        
                        <div class="flex justify-end pt-1">
                            <button type="button" onclick="insertFormat('\n\n---\n\n', '')" class="text-xs bg-brand/10 hover:bg-brand/20 text-brand font-semibold py-2 px-3 rounded-lg transition-colors flex items-center gap-1.5">
                                <i class="ph ph-plus-circle text-base"></i> Add New Page
                            </button>
                        </div>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-800">

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Signatory Authority</label>
                        <input type="text" id="input-sign-name" value="Pabitra Mondal" placeholder="Your Name" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        <input type="text" id="input-sign-role" value="Founder & CEO, Falconix Digital" placeholder="Your Title" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        
                        <div class="pt-2">
                            <label class="block text-[10px] text-gray-500 mb-1">Digital Signature (Image URL or Upload)</label>
                            <div class="flex gap-2">
                                <input type="url" id="input-sign-url" value="https://i.ibb.co/9Hc54PS8/Pabitra-Mondal-Signature.jpg" placeholder="https://example.com/signature.png" class="flex-1 min-w-0 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                                <label class="cursor-pointer bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-700 rounded-lg px-3 flex items-center justify-center transition-colors shadow-sm">
                                    <i class="ph ph-upload-simple text-gray-700 dark:text-gray-300"></i>
                                    <input type="file" id="file-sign" class="hidden" accept="image/*">
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 dark:border-gray-800">

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Partner Details (Optional)</label>
                        <p class="text-[10px] text-gray-500 mb-2 leading-tight">Fill these to add a second logo and signature for collaboration documents.</p>
                        
                        <input type="text" id="input-partner-sign-name" placeholder="Partner Signatory Name" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        <input type="text" id="input-partner-sign-role" placeholder="Partner Title / Company" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all text-gray-900 dark:text-white">
                        
                        <div class="pt-2">
                            <label class="block text-[10px] text-gray-500 mb-1">Partner Logo (Image URL or Upload)</label>
                            <div class="flex gap-2">
                                <input type="url" id="input-partner-logo-url" placeholder="https://example.com/partner-logo.png" class="flex-1 min-w-0 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none text-gray-900 dark:text-white">
                                <label class="cursor-pointer bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-700 rounded-lg px-3 flex items-center justify-center transition-colors shadow-sm">
                                    <i class="ph ph-upload-simple text-gray-700 dark:text-gray-300"></i>
                                    <input type="file" id="file-partner-logo" class="hidden" accept="image/*">
                                </label>
                            </div>
                        </div>
                        <div class="pt-2">
                            <label class="block text-[10px] text-gray-500 mb-1">Partner Signature (Image URL or Upload)</label>

                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600; 
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        document.getElementById(urlInputId).value = canvas.toDataURL('image/png', 0.9);
                        updatePreview();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

        function parseFormatting(text) {
            if (!text) return '<span class="text-gray-400 italic">[Your letter content will appear here.]</span>';
            
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            html = html.replace(/==([^=]+)==/g, '<mark class="bg-brandAccent/40 px-1.5 py-0.5 rounded font-semibold text-gray-900">$1</mark>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/_([^_]+)_/g, '<em>$1</em>'); 
            
            html = html.replace(/\[center\]([\s\S]*?)\[\/center\]/g, '<div class="text-center">$1</div>');
            html = html.replace(/\[right\]([\s\S]*?)\[\/right\]/g, '<div class="text-right">$1</div>');
            
            const lines = html.split('\n');
            let inList = false;
            let inTable = false;
            let finalHtml = '';

            lines.forEach(line => {
                let tLine = line.trim();
                
                if (tLine.startsWith('- ')) {
                    if (inTable) { finalHtml += '</tbody></table>'; inTable = false; }
                    if (!inList) {
                        finalHtml += '<ul class="list-disc pl-5 my-2 space-y-1">';
                        inList = true;
                    }
                    finalHtml += `<li>${line.substring(2)}</li>`;
                
                } else if (tLine.startsWith('|') && tLine.endsWith('|')) {
                    if (inList) { finalHtml += '</ul>'; inList = false; }
                    
                    if (!inTable) {
                        finalHtml += '<table class="w-full text-left border-collapse my-4 border border-gray-300 dark:border-gray-700"><thead>';
                        inTable = true;
                    }
                    
                    if (tLine.includes('---')) {
                        finalHtml += '</thead><tbody>'; 
                    } else {
                        const cells = tLine.substring(1, tLine.length - 1).split('|');
                        finalHtml += '<tr>';
                        cells.forEach(cell => {
                            const tag = finalHtml.includes('<tbody>') ? 'td' : 'th';
                            finalHtml += `<${tag} class="border border-gray-300 dark:border-gray-700 px-3 py-2 text-sm">${cell.trim()}</${tag}>`;
                        });
                        finalHtml += '</tr>';
                    }
                } else {
                    if (inList) { finalHtml += '</ul>'; inList = false; }
                    if (inTable) { finalHtml += '</tbody></table>'; inTable = false; }
                    
                    if (tLine.match(/^<div class="text-(center|right)">$/) || tLine === '</div>') {
                        finalHtml += tLine;
                    } else {
                        finalHtml += line + (tLine === '' ? '<br>' : '<br>'); 
                    }
                }
            });
            if (inList) finalHtml += '</ul>';
            if (inTable) {
                if(!finalHtml.includes('<tbody>')) finalHtml += '</thead>'; 
                finalHtml += '</tbody></table>'; 
            }
            
            return finalHtml.replace(/<br><ul/g, '<ul').replace(/<\/ul><br>/g, '</ul>');
        }

        window.insertFormat = function(prefix, suffix) {
            const textarea = inputs.body;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            
            let finalPrefix = prefix;
            if ((prefix.includes('- ') || prefix.includes('---') || prefix.includes('|')) && start > 0 && textarea.value.charAt(start - 1) !== '\n') {
                finalPrefix = '\n' + prefix;
            }

            const insertion = finalPrefix + selectedText + suffix;
            textarea.value = textarea.value.substring(0, start) + insertion + textarea.value.substring(end);
            
            textarea.focus();
            if (selectedText.length === 0) {
                textarea.selectionStart = start + finalPrefix.length;
                textarea.selectionEnd = start + finalPrefix.length;
            } else {
                textarea.selectionStart = start + insertion.length;
                textarea.selectionEnd = start + insertion.length;
            }
            
            updatePreview();
            saveStateToHistory(); 
        };

                                <div class="font-medium"><p>Ref: <span class="text-black">${state.ref}</span></p></div>
                                <div class="font-medium"><p>Date: <span class="text-black">${new Date(state.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</span></p></div>
                            </div>
                            <div class="mb-8">
                                <p class="text-sm font-bold text-black mb-1">To,</p>
                                <p class="text-sm font-semibold text-black">${state.toName}</p>
                                ${state.toCompany ? `<p class="text-sm font-medium text-gray-800">${state.toCompany}</p>` : ''}
                                ${state.toAddress ? `<p class="text-sm text-gray-700 whitespace-pre-line mt-1">${state.toAddress}</p>` : ''}
                            </div>
                            <div class="mb-8 flex">
                                <span class="text-sm font-bold text-black w-20 shrink-0">Subject:</span>
                                <p class="text-sm font-bold text-black flex-1 underline underline-offset-4 decoration-brand">${state.subject}</p>
                            </div>
                        ` : `<div class="mb-6"><span class="text-xs text-gray-400 uppercase tracking-wider font-bold">Continued...</span></div>`}

                        <div class="text-sm text-gray-800 leading-[1.8] flex-1">
                            <div class="text-justify text-gray-800 space-y-2">
                                ${parseFormatting(pageContent)}
                            </div>
                        </div>

                        ${isLast ? `
                            <div class="mt-16 pt-8 grid grid-cols-2 gap-8">
                                <div>
                                    <p class="text-sm text-gray-800 mb-4">Sincerely,</p>
                                    <div class="mb-2 relative w-max h-20 flex items-end">
                                        ${state.signUrl 
                                            ? `<img src="${state.signUrl}" class="h-20 object-contain mix-blend-multiply" alt="Signature" crossorigin="anonymous">` 
                                            : `<p class="font-signature text-4xl text-blue-900 transform -rotate-3 opacity-90 pb-2 pr-4">${state.signName}</p>`}
                                        ${state.logoUrl ? `
                                        <div class="absolute top-0 right-0 transform rotate-[-10deg] -translate-y-4 translate-x-10 pointer-events-none opacity-[0.15]">
                                            <img src="${state.logoUrl}" class="w-20 h-20 object-contain mix-blend-multiply" alt="Company Seal" crossorigin="anonymous">
                                        </div>
                                        ` : ''}
                                    </div>
                                    <p class="text-sm font-bold text-black mt-2">${state.signName}</p>
                                    <p class="text-xs font-medium text-gray-700">${state.signRole}</p>
                                </div>

                                ${(state.partnerSignName || state.partnerSignRole || state.partnerSignUrl) ? `
                                <div>
                                    <p class="text-sm text-gray-800 mb-4">Acknowledged & Agreed,</p>
                                    <div class="mb-2 relative w-max h-20 flex items-end">
                                        ${state.partnerSignUrl 
                                            ? `<img src="${state.partnerSignUrl}" class="h-20 object-contain mix-blend-multiply" alt="Partner Signature" crossorigin="anonymous">` 
                                            : `<p class="font-signature text-4xl text-blue-900 transform -rotate-3 opacity-90 pb-2 pr-4">${state.partnerSignName || 'Partner Name'}</p>`}
                                        ${state.partnerLogoUrl ? `
                                        <div class="absolute top-0 right-0 transform rotate-[-10deg] -translate-y-4 translate-x-10 pointer-events-none opacity-[0.15]">
                                            <img src="${state.partnerLogoUrl}" class="w-20 h-20 object-contain mix-blend-multiply" alt="Partner Seal" crossorigin="anonymous">
                                        </div>
                                        ` : ''}
                                    </div>
                                    <p class="text-sm font-bold text-black mt-2">${state.partnerSignName || 'Partner Name'}</p>
                                    <p class="text-xs font-medium text-gray-700">${state.partnerSignRole || 'Partner Title'}</p>
                                </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <div class="px-12 py-6 bg-darkBg flex justify-between items-center text-[10px] text-gray-400 relative z-10">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brandDark via-brand to-brandAccent"></div>
                        <p>Address: ${state.agencyAddress}</p>
                        <p class="font-medium text-brandAccent tracking-widest uppercase">
                            ${isLast ? 'CONFIDENTIAL' : `PAGE ${index + 1} OF ${pages.length}`}
                        </p>
                    </div>
                </div>
                `;
            });

            document.getElementById('document-wrapper').innerHTML = html;
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', () => {
                updatePreview();
                if(input.id === 'input-body') saveStateToHistory();
            });
        });

        inputs.template.addEventListener('change', (e) => {
            const val = e.target.value;
            if (templates[val]) {
                inputs.subject.value = templates[val].subject;
                inputs.body.value = templates[val].body;
                updatePreview();
                saveStateToHistory();
            }
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const wrapper = document.getElementById('document-wrapper');
            const previewContainer = document.querySelector('.preview-container');
            const mainContent = document.querySelector('main');
            const body = document.body;
            const btn = document.getElementById('btn-download');
            const originalHtml = btn.innerHTML;
            
            btn.innerHTML = `<i class="ph ph-spinner animate-spin text-xl"></i> Generating PDF...`;
            btn.disabled = true;

            const origPreviewOverflow = previewContainer.style.overflow;
            const origMainOverflow = mainContent.style.overflow;
            
            previewContainer.style.overflow = 'visible';
            mainContent.style.overflow = 'visible';
            body.classList.remove('h-screen');
            body.style.height = 'auto';
            
            wrapper.classList.remove('gap-8', 'pb-8');
            
            const pages = wrapper.querySelectorAll('.a4-page');
            pages.forEach(page => {
                page.classList.remove('shadow-2xl');
                page.style.boxShadow = 'none';
                page.style.margin = '0';
            });
            const refText = inputs.ref.value.trim() || 'No-Ref';
            const subjectText = inputs.subject.value.trim() || 'Document';

            const combinedName = `${refText}_${subjectText}`;
            const safeName = combinedName.replace(/[^a-zA-Z0-9\-]/g, '_');

            const opt = {
                margin:       0,
                filename:     `${safeName}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, logging: false, scrollY: 0, windowHeight: wrapper.scrollHeight },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'css', before: '.page-break-before' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(wrapper).save().then(() => {
                    previewContainer.style.overflow = origPreviewOverflow;
                    mainContent.style.overflow = origMainOverflow;
                    body.classList.add('h-screen');
                    body.style.height = '';
                    wrapper.classList.add('gap-8', 'pb-8');
                    pages.forEach(page => {
                        page.classList.add('shadow-2xl');
                        page.style.boxShadow = '';
                        page.style.margin = '0 auto';
                    });
                    btn.innerHTML = `<i class="ph ph-check-circle text-xl"></i> Downloaded!`;
                    setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 2000);
                }).catch(err => {
                    console.error("PDF Generation Error: ", err);
                    previewContainer.style.overflow = origPreviewOverflow;
                    mainContent.style.overflow = origMainOverflow;
                    body.classList.add('h-screen');
                    body.style.height = '';
                    wrapper.classList.add('gap-8', 'pb-8');
                    pages.forEach(page => {
                        page.classList.add('shadow-2xl');
                        page.style.boxShadow = '';
                        page.style.margin = '0 auto';
                    });
                    showToast("Failed to generate PDF.", "error");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                });
            }, 100);
        });

        let currentUser = null;
        let lettersList = [];
        let unsubscribeLetters = null;

        const loginWrapper = document.getElementById('login-wrapper');
        const appWrapper = document.getElementById('app-wrapper');
        const loginBtn = document.getElementById('google-login-btn');
        const loginError = document.getElementById('login-error');
        const authLogoutBtn = document.getElementById('auth-logout-btn');

        const btnSaveCloud = document.getElementById('btn-save-cloud');
        const btnViewCloud = document.getElementById('btn-view-cloud');
        const cloudModal = document.getElementById('cloud-modal');
        const cloudContainer = document.getElementById('cloud-letters-container');
        const formatDate = (ms) => new Date(ms).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

        function setupDatabaseListener() {
            if (!currentUser) return;
            const lettersRef = collection(db, 'artifacts', fbAppId, 'public', 'data', 'saved_letters');
            
            unsubscribeLetters = onSnapshot(lettersRef, (snapshot) => {
                lettersList = [];
                snapshot.forEach(doc => {
                    lettersList.push({ id: doc.id, ...doc.data() });
                });
                
                lettersList.sort((a, b) => b.createdAt - a.createdAt);
                
                if (!cloudModal.classList.contains('hidden')) {
                    renderCloudLetters();
                }
            }, (error) => {
                console.error("Database sync error:", error);
                showToast("Real-time database sync failed.", "error");
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ALLOWED_EMAIL) {
                currentUser = user;
                
                loginWrapper.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loginWrapper.classList.add('hidden');
                    appWrapper.classList.remove('hidden');
                    appWrapper.classList.add('flex');
                    setTimeout(() => appWrapper.classList.remove('opacity-0'), 50);
                    
                    loadAutoSave();
                    updateDraftsDropdown();
                    saveStateToHistory(); 
                    updatePreview();
                    setupDatabaseListener();
                }, 500);

            } else {
                currentUser = null;
                if (unsubscribeLetters) unsubscribeLetters();
                lettersList = [];
                
                appWrapper.classList.add('opacity-0');
                setTimeout(() => {
                    appWrapper.classList.add('hidden');
                    appWrapper.classList.remove('flex');
                    loginWrapper.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                }, 500);
                
                if (user) {
                    loginError.innerText = "Unauthorized account. Access restricted.";
                    loginError.classList.remove('hidden');
                    signOut(auth);
                }
            }
        });

        loginBtn.addEventListener('click', async () => {
            loginError.classList.add('hidden');
            const defaultHtml = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Authenticating...';
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error("Login failed", err);
                loginError.innerText = "Login process was cancelled or failed.";
                loginError.classList.remove('hidden');
            } finally {
                if(!currentUser) loginBtn.innerHTML = defaultHtml;
            }
        });

        authLogoutBtn.addEventListener('click', () => {
            if (currentUser) {
                signOut(auth);
            }
        });

        btnSaveCloud.addEventListener('click', async () => {
            if (!currentUser) {
                showToast("You must be logged in.", "error");
                return;
            }
            const originalHtml = btnSaveCloud.innerHTML;
            btnSaveCloud.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Saving...';
            btnSaveCloud.disabled = true;

            try {
                const state = {};
                Object.keys(inputs).forEach(key => state[key] = inputs[key].value);
                const letterType = inputs.template.value || 'blank';
                
                const docId = crypto.randomUUID();
                const docRef = doc(db, 'artifacts', fbAppId, 'public', 'data', 'saved_letters', docId);

                await setDoc(docRef, {
                    data: state,
                    type: letterType,
                    subject: inputs.subject.value.trim() || 'Untitled Document',
                    recipient: inputs.toName.value.trim() || 'Unknown Recipient',
                    ref: inputs.ref.value.trim(),
                    createdAt: Date.now()
                });

                btnSaveCloud.innerHTML = '<i class="ph ph-check text-lg"></i> Saved to Cloud!';
                showToast("Letter saved securely to the cloud.", "success");
                setTimeout(() => { btnSaveCloud.innerHTML = originalHtml; btnSaveCloud.disabled = false; }, 2000);
            } catch (error) {
                console.error("Error saving document: ", error);
                showToast("Failed to save to cloud.", "error");
                btnSaveCloud.innerHTML = originalHtml;
                btnSaveCloud.disabled = false;
            }
        });

        function renderCloudLetters() {
            cloudContainer.innerHTML = '';
            
            if (lettersList.length === 0) {
                cloudContainer.innerHTML = '<div class="text-center text-gray-500 mt-10">No cloud letters saved yet.</div>';
                return;
            }

            const grouped = lettersList.reduce((acc, curr) => {
                if (!acc[curr.type]) acc[curr.type] = [];
                acc[curr.type].push(curr);
                return acc;
            }, {});

            let html = '<div class="space-y-8">';
            const typeLabels = {
                blank: 'Blank Documents', offer: 'Job Offer Letters', collab: 'Collaboration Proposals',
                nda: 'Non-Disclosure Agreements', warning: 'Warning Letters', termination: 'Termination Letters',
                apology: 'Formal Apologies', onboarding: 'Client Onboarding'
            };

            Object.keys(grouped).forEach(type => {
                const groupLetters = grouped[type];
                html += `
                    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden shadow-sm">
                        <div class="bg-brand/10 dark:bg-brand/20 px-4 py-3 border-b border-brand/20">
                            <h3 class="font-bold text-brand uppercase tracking-wider text-xs">${typeLabels[type] || type} <span class="bg-brand text-white px-2 py-0.5 rounded-full text-[10px] ml-2">${groupLetters.length}</span></h3>
                        </div>
                        <div class="divide-y divide-gray-100 dark:divide-gray-800">
                `;
                
                groupLetters.forEach(letter => {
                    const dataStr = encodeURIComponent(JSON.stringify(letter.data));
                    html += `
                        <div class="p-4 flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                            <div>
                                <h4 class="font-bold text-gray-900 dark:text-white text-sm">${letter.subject}</h4>
                                <p class="text-xs text-gray-500 mt-1">Ref: <span class="font-medium">${letter.ref || 'N/A'}</span> &bull; To: ${letter.recipient}</p>
                                <p class="text-[10px] text-gray-400 mt-1"><i class="ph ph-clock"></i> Saved: ${formatDate(letter.createdAt)}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="loadCloudLetter('${dataStr}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 dark:bg-blue-900/30 dark:text-blue-400 rounded-lg text-xs font-semibold transition-colors">Load</button>
                                <button onclick="deleteCloudLetter('${letter.id}')" class="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400 rounded-lg text-xs font-semibold transition-colors">Delete</button>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });
            html += '</div>';
            cloudContainer.innerHTML = html;
        }

        btnViewCloud.addEventListener('click', () => {
            if (!currentUser) return;
            cloudModal.classList.remove('hidden');
            if (lettersList.length > 0) {
                renderCloudLetters();
            } else {
                cloudContainer.innerHTML = '<div class="flex justify-center items-center h-full text-gray-500"><i class="ph ph-spinner animate-spin text-3xl"></i></div>';
            }
        });

        window.loadCloudLetter = function(encodedData) {
            try {
                const data = JSON.parse(decodeURIComponent(encodedData));
                Object.keys(inputs).forEach(key => {
                    if (inputs[key] && data[key] !== undefined) inputs[key].value = data[key];
                });
                updatePreview();
                saveStateToHistory();
                cloudModal.classList.add('hidden');
                showToast("Cloud letter loaded successfully.", "success");
            } catch (e) {
                showToast("Failed to load letter data.", "error");
            }
        };

        window.deleteCloudLetter = async function(id) {
            if (!currentUser) return;
            if (!confirm("Are you sure you want to permanently delete this archived letter?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', fbAppId, 'public', 'data', 'saved_letters', id));
                showToast("Letter deleted securely.", "success");
            } catch (e) {
                showToast("Failed to delete letter.", "error");
            }
        };

    </script>
</body>
</html>
